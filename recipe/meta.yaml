{% set name = "pyaml" %}
{% set version = "26.7.0" %}
{% set skip_tests_win = [
  " --deselect=test_cli.py::CliToolTests::test_multiple_args",
  " --deselect=test_cli.py::CliToolTests::test_out_file",
  " --deselect=test_dump.py::DumpTests::test_repr_undefined",
  " --deselect=test_cli.py::CliToolTests::test_replace"
] %}

# Skip few tests that won't work on Windows OS
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 11cda3a796efc6dbce0d56836be56cfd26289dad07bcd78e9904086729929c93

build:
  skip: true  # [py<38]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - pyaml = pyaml.cli:main

requirements:
  build:
    - python
    - pip
  host:
    - python
    - setuptools
    - pip
    - wheel
  run:
    - python
    - pyyaml

test:
  requires:
    - pip
    - pytest
  imports:
    - pyaml
    - pyaml.tests
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pyaml --help
    # Tests are looking for Python type names prefixed with 'pyaml.tests'
    - pytest --pyargs pyaml.tests {{ skip_tests_win | join(' ') }}

about:
  home: https://github.com/mk-fg/pretty-yaml
  license: WTFPL
  license_file: COPYING
  license_family: OTHER
  summary: PyYAML-based module to produce pretty and readable YAML-serialized data
  description: PyYAML-based python module to produce a bit more pretty and human-readable YAML-serialized data.
  dev_url: https://github.com/mk-fg/pretty-yaml
  doc_url: https://github.com/mk-fg/pretty-yaml

extra:
  recipe-maintainers:
    - pmlandwehr
